<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convenios Crediticios en Tesla Chile</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: #1c1c1c;
      --panel-strong: #242424;
      --line: #333333;
      --text: #f4f4f4;
      --muted: #b7b7b7;
      --soft: #858585;
      --tesla: #e82127;
      --ok: #37d67a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(232, 33, 39, 0.12), transparent 28%),
        linear-gradient(135deg, #0d0d0d 0%, #171717 48%, #0f0f0f 100%);
      color: var(--text);
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 34px clamp(18px, 4vw, 56px) 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .tesla-mark {
      height: 17px;
      max-width: 150px;
      object-fit: contain;
      filter: invert(1);
      opacity: 0.95;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(55, 214, 122, 0.32);
      background: rgba(55, 214, 122, 0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 13px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 18px rgba(55, 214, 122, 0.8);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.94fr) minmax(360px, 1.06fr);
      gap: clamp(24px, 4vw, 54px);
      align-items: start;
    }

    h1 {
      margin: 0 0 14px;
      max-width: 760px;
      font-size: 72px;
      line-height: 0.95;
      font-weight: 500;
      letter-spacing: 0;
    }

    .lead {
      max-width: 600px;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.42;
    }

    .bank-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .bank-button {
      min-height: 132px;
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      cursor: pointer;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .bank-button:hover,
    .bank-button:focus-visible {
      border-color: rgba(232, 33, 39, 0.8);
      background: rgba(232, 33, 39, 0.1);
      transform: translateY(-2px);
      outline: none;
    }

    .bank-button[aria-pressed="true"] {
      border-color: var(--tesla);
      background: rgba(232, 33, 39, 0.16);
    }

    .logo-set {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .bank-button .logo-set {
      width: 100%;
      height: 48px;
    }

    .logo-set img {
      object-fit: contain;
    }

    .logo-set.single img {
      max-width: 100%;
      max-height: 100%;
    }

    .logo-set.duo {
      flex-direction: column;
      gap: 7px;
    }

    .logo-set.duo img {
      max-width: 100%;
      max-height: 23px;
    }

    .bank-button[data-bank="itau"] .logo-set {
      height: 58px;
    }

    .bank-button[data-bank="itau"] img {
      max-height: 58px;
    }

    .bank-button[data-bank="tanner"] .logo-set {
      height: 54px;
    }

    .bank-button[data-bank="bci"] .logo-set {
      height: 54px;
    }

    .bank-button[data-bank="bancoChile"] .logo-set {
      height: 54px;
    }

    .bank-button span {
      color: var(--muted);
      font-size: 13px;
    }

    .bank-grid > .detail {
      grid-column: 1 / -1;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(28, 28, 28, 0.86);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      scroll-margin-top: 18px;
    }

    .detail[hidden] {
      display: none;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px clamp(18px, 3vw, 30px);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
      border-bottom: 1px solid var(--line);
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .detail-logo-wrap {
      width: 132px;
      height: 58px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-logo-wrap .logo-set {
      width: 100%;
      height: 100%;
    }

    .detail-logo-wrap .logo-set.duo {
      align-items: flex-start;
    }

    .detail-logo {
      max-width: 132px;
      max-height: 58px;
      object-fit: contain;
    }

    .detail h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
      font-size: 14px;
    }

    .option-list {
      display: grid;
      gap: 0;
    }

    .option-card {
      padding: clamp(18px, 3vw, 28px) clamp(18px, 3vw, 30px);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 16px;
    }

    .option-card:last-child {
      border-bottom: 0;
    }

    .option-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .option-card h3 {
      margin: 0;
      font-size: 25px;
      line-height: 1.12;
      font-weight: 500;
      letter-spacing: 0;
    }

    .type {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .validity {
      border: 1px solid rgba(232, 33, 39, 0.38);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 13px;
      white-space: nowrap;
      background: rgba(232, 33, 39, 0.09);
    }

    .info-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .info-toggle {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.055);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      padding: 11px 13px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .info-toggle:hover,
    .info-toggle:focus-visible,
    .info-toggle[aria-expanded="true"] {
      border-color: rgba(232, 33, 39, 0.7);
      background: rgba(232, 33, 39, 0.12);
      outline: none;
    }

    .info-panel {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }

    .sim-panel {
      display: grid;
      gap: 16px;
    }

    .info-panel[hidden] {
      display: none;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .sim-field {
      display: grid;
      gap: 6px;
    }

    .sim-field input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      font: inherit;
      padding: 11px 12px;
    }

    .sim-field input:focus {
      border-color: rgba(232, 33, 39, 0.78);
      outline: none;
    }

    .input-with-suffix {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
      max-width: 100%;
    }

    .input-with-suffix input {
      width: 84px;
      padding-right: 12px;
      text-align: left;
    }

    .input-suffix {
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    .sim-rate {
      color: var(--muted);
      font-size: 14px;
    }

    .sim-result {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .sim-result-box {
      border: 1px solid rgba(232, 33, 39, 0.24);
      border-radius: 8px;
      background: rgba(232, 33, 39, 0.08);
      padding: 14px;
    }

    .sim-result-value {
      color: var(--text);
      font-size: 22px;
      line-height: 1.15;
      font-weight: 500;
    }

    .sim-note {
      color: var(--soft);
      font-size: 13px;
      line-height: 1.4;
    }

    .label {
      color: var(--soft);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .value {
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
    }

    .footnote {
      margin-top: 26px;
      color: var(--soft);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 940px) {
      .hero {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 56px;
      }

      .lead {
        margin-bottom: 10px;
      }

      .bank-grid {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .app {
        padding-top: 24px;
      }

      .topbar,
      .detail-header,
      .option-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .bank-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 42px;
      }

      .lead {
        font-size: 17px;
      }

      .bank-button {
        min-height: 104px;
      }

      .sim-grid,
      .sim-result {
        grid-template-columns: 1fr;
      }

      .validity,
      .count,
      .status-pill {
        white-space: normal;
      }
    }
  </style>
</head>

    const buttons = Array.from(document.querySelectorAll(".bank-button"));
    const bankName = document.getElementById("bankName");
    const bankCount = document.getElementById("bankCount");
    const bankWindow = document.getElementById("bankWindow");
    const detailLogos = document.getElementById("detailLogos");
    const optionList = document.getElementById("optionList");
    const currentPromoDate = document.getElementById("currentPromoDate");
    const hero = document.querySelector(".hero");
    const detailPanel = document.querySelector(".detail");

    function optionLabel(count) {
      return count === 1 ? "1 opción activa" : `${count} opciones activas`;
    }

    function setCurrentPromoDate() {
      const formatter = new Intl.DateTimeFormat("es-CL", {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "America/Santiago"
      });
      currentPromoDate.textContent = `Promos activas al ${formatter.format(new Date()).replace(".", "")}`;
    }

    function logoMarkup(bank, className = "") {
      const kind = bank.logos.length > 1 ? "duo" : "single";
      const images = bank.logos.map((logo) => (
        `<img class="detail-logo" src="${logo.src}" alt="${logo.alt}">`
      )).join("");

      return `<div class="logo-set ${kind} ${className}">${images}</div>`;
    }

    function formatCurrency(value) {
      const safeValue = Number.isFinite(value) ? Math.max(0, value) : 0;
      return new Intl.NumberFormat("es-CL", {
        style: "currency",
        currency: "CLP",
        maximumFractionDigits: 0
      }).format(Math.round(safeValue));
    }

    function parseCurrency(value) {
      return Number(String(value).replace(/[^\d]/g, "")) || 0;
    }

    function formatCurrencyInput(input) {
      input.value = formatCurrency(parseCurrency(input.value));
    }

    function formatPercent(value) {
      return new Intl.NumberFormat("es-CL", {
        minimumFractionDigits: value % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function calculatePayment(amount, months, ratePercent, balloonPercent) {
      const total = Math.max(0, amount);
      const term = Math.max(1, Math.round(months));
      const rate = Math.max(0, ratePercent) / 100;
      const balloon = total * Math.max(0, balloonPercent) / 100;

      if (rate === 0) {
        return {
          payment: (total - balloon) / term,
          balloon
        };
      }

      const discountFactor = Math.pow(1 + rate, -term);
      const payment = (total - balloon * discountFactor) * rate / (1 - discountFactor);

      return {
        payment,
        balloon
      };
    }

    function updateSimulator(panel) {
      if (!panel) return;

      const amount = parseCurrency(panel.querySelector('[data-field="amount"]').value);
      const months = Number(panel.querySelector('[data-field="months"]').value);
      const balloon = Number(panel.querySelector('[data-field="balloon"]').value);
      const rate = Number(panel.dataset.rate);
      const result = calculatePayment(amount, months, rate, balloon);

      panel.querySelector('[data-result="payment"]').textContent = formatCurrency(result.payment);
      panel.querySelector('[data-result="balloon"]').textContent = formatCurrency(result.balloon);
    }

    function updateAllSimulators() {
      optionList.querySelectorAll(".sim-panel").forEach(updateSimulator);
    }

    function isCompactViewport() {
      return window.matchMedia("(max-width: 940px)").matches;
    }

    function placeDetailPanel(selectedButton) {
      if (isCompactViewport()) {
        selectedButton.insertAdjacentElement("afterend", detailPanel);
        return;
      }

      if (detailPanel.parentElement !== hero) {
        hero.appendChild(detailPanel);
      }
    }

    function scrollToSelectedBank(selectedButton) {
      const top = selectedButton.getBoundingClientRect().top + window.scrollY - 18;

      window.scrollTo({
        top,
        behavior: "smooth"
      });
    }

    function clearSelection() {
      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", "false");
      });
      detailPanel.hidden = true;
    }

    function renderBank(bankKey) {
      const bank = banks[bankKey];
      bankName.textContent = bank.name;
      bankCount.textContent = optionLabel(bank.options.length);
      bankWindow.textContent = bank.window;
      detailLogos.innerHTML = logoMarkup(bank);

      optionList.innerHTML = bank.options.map((option, index) => {
        const notesId = `${bankKey}-${index}-notes`;
        const howId = `${bankKey}-${index}-how`;
        const simId = `${bankKey}-${index}-sim`;
        const hasNotes = Boolean((option.notes || "").trim());
        const hasHow = Boolean((option.how || "").trim());
        const sim = option.simulation || { rate: 0, months: 36, balloon: 30 };
        const actions = [
          hasNotes ? `<button class="info-toggle" type="button" aria-expanded="false" aria-controls="${notesId}" data-target="${notesId}">Más información</button>` : "",
          hasHow ? `<button class="info-toggle" type="button" aria-expanded="false" aria-controls="${howId}" data-target="${howId}">Pasos a seguir</button>` : "",
          `<button class="info-toggle" type="button" aria-expanded="false" aria-controls="${simId}" data-kind="sim" data-target="${simId}">Simular</button>`
        ].join("");

        return `
        <article class="option-card">
          <div class="option-top">
            <div>
              <h3>${option.promotion}</h3>
              <div class="type">${option.type}</div>
            </div>
            <div class="validity">${option.validity}</div>
          </div>
          ${actions ? `<div class="info-actions">${actions}</div>` : ""}
          ${hasNotes ? `<div class="info-panel" id="${notesId}" hidden>
            <div class="label">Más información</div>
            <div class="value">${option.notes}</div>
          </div>` : ""}
          ${hasHow ? `<div class="info-panel" id="${howId}" hidden>
            <div class="label">Pasos a seguir</div>
            <div class="value">${option.how}</div>
          </div>` : ""}
          <div class="info-panel sim-panel" id="${simId}" data-rate="${sim.rate}" hidden>
            <div>
              <div class="label">Tasa del convenio</div>
              <div class="sim-rate">${formatPercent(sim.rate)}% mensual</div>
            </div>
            <div class="sim-grid">
              <label class="sim-field">
                <span class="label">Monto vehículo</span>
                <input class="sim-input" type="text" inputmode="numeric" data-field="amount" value="${formatCurrency(30000000)}">
              </label>
              <label class="sim-field">
                <span class="label">Meses</span>
                <input class="sim-input" type="number" min="1" step="1" data-field="months" value="${sim.months}">
              </label>
              <label class="sim-field">
                <span class="label">Cuotón final</span>
                <span class="input-with-suffix">
                  <input class="sim-input" type="number" min="0" max="90" step="1" data-field="balloon" value="${sim.balloon}">
                  <span class="input-suffix">%</span>
                </span>
              </label>
            </div>
            <div class="sim-result">
              <div class="sim-result-box">
                <div class="label">Valor cuota</div>
                <div class="sim-result-value" data-result="payment">$0</div>
              </div>
              <div class="sim-result-box">
                <div class="label">Cuotón final</div>
                <div class="sim-result-value" data-result="balloon">$0</div>
              </div>
            </div>
            <div class="sim-note">Valor cuota simulado referencial. No incluye costos extras asociados al crédito ni el porcentaje aplicado por la pasarela de pagos.</div>
          </div>
        </article>
      `;
      }).join("");
      updateAllSimulators();

      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.bank === bankKey));
      });
    }

    optionList.addEventListener("click", (event) => {
      const trigger = event.target.closest(".info-toggle");
      if (!trigger) return;

      const panel = document.getElementById(trigger.dataset.target);
      const isOpen = trigger.getAttribute("aria-expanded") === "true";
      trigger.setAttribute("aria-expanded", String(!isOpen));
      panel.hidden = isOpen;

      if (trigger.dataset.kind === "sim") {
        updateSimulator(panel);
      }
    });

    optionList.addEventListener("input", (event) => {
      if (!event.target.matches(".sim-input")) return;
      if (event.target.dataset.field === "amount") {
        formatCurrencyInput(event.target);
      }
      updateSimulator(event.target.closest(".sim-panel"));
    });

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        if (isCompactViewport() && button.getAttribute("aria-pressed") === "true" && !detailPanel.hidden) {
          clearSelection();
          return;
        }

        renderBank(button.dataset.bank);
        placeDetailPanel(button);
        detailPanel.hidden = false;

        if (isCompactViewport()) {
          scrollToSelectedBank(button);
        }
      });
    });

    setCurrentPromoDate();

    if (isCompactViewport()) {
      clearSelection();
    } else {
      renderBank("scotiabank");
      detailPanel.hidden = false;
      placeDetailPanel(buttons[0]);
    }

    window.addEventListener("resize", () => {
      const selectedButton = buttons.find((button) => button.getAttribute("aria-pressed") === "true");

      if (isCompactViewport()) {
        if (selectedButton && !detailPanel.hidden) {
          placeDetailPanel(selectedButton);
        } else {
          clearSelection();
        }
        return;
      }

      if (selectedButton) {
        detailPanel.hidden = false;
        placeDetailPanel(selectedButton);
        return;
      }

      renderBank("scotiabank");
      detailPanel.hidden = false;
      placeDetailPanel(buttons[0]);
    });
  </script>
</body>
</html>
